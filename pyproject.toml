[project]
name = "citerank"
version = "0.1.0"
description = "Moteur open-source d'intelligence AI-Search : Readiness, Visibilité IA, citabilité et remédiation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LAMARCA" }]
keywords = ["geo", "aeo", "seo", "ai-search", "llm", "generative-engine-optimization"]
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.2"]

[project.scripts]
citerank = "citerank.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["citerank*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# BLE001 : les adaptateurs de fournisseurs (providers/) attrapent volontairement
# toute exception — un moteur IA en panne ne doit jamais casser le consensus, il
# renvoie un résultat vide. C'est un choix de conception documenté, pas un oubli.
ignore = ["BLE001"]
